# Embedding Explorer 3D
#   cp .env.example .env
#   docker compose up --build -d          → http://localhost:8088
# Only the frontend is published (on 127.0.0.1 by default); the backend is reachable only on
# the compose network, through the nginx /api/ proxy.
name: embedding-explorer

services:
  viz-backend:
    build: ./backend
    image: embedding-explorer-backend:1.0.0
    restart: unless-stopped
    environment:
      VIZ_DB_URL: ${VIZ_DB_URL:-jdbc:postgresql://host.docker.internal:5432/chatbot}
      VIZ_DB_USER: ${VIZ_DB_USER:-chatbot}
      VIZ_DB_PASSWORD: ${VIZ_DB_PASSWORD:-}
      VIZ_DB_SCHEMA: ${VIZ_DB_SCHEMA:-public}
      VIZ_DB_TABLE: ${VIZ_DB_TABLE:-vector_store}
      VIZ_DB_STATEMENT_TIMEOUT: ${VIZ_DB_STATEMENT_TIMEOUT:-15s}
      VIZ_DB_CONNECTION_TIMEOUT: ${VIZ_DB_CONNECTION_TIMEOUT:-5s}
      VIZ_DISTANCE_METRIC: ${VIZ_DISTANCE_METRIC:-auto}
      VIZ_MAX_POINTS: ${VIZ_MAX_POINTS:-5000}
      VIZ_SNAPSHOT_MEMORY_BUDGET_MB: ${VIZ_SNAPSHOT_MEMORY_BUDGET_MB:-256}
      VIZ_EMBEDDING_ENABLED: ${VIZ_EMBEDDING_ENABLED:-false}
      VIZ_EMBEDDING_BASE_URL: ${VIZ_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      VIZ_EMBEDDING_MODEL: ${VIZ_EMBEDDING_MODEL:-text-embedding-3-small}
      VIZ_EMBEDDING_API_KEY: ${VIZ_EMBEDDING_API_KEY:-}
      VIZ_SEARCH_RATE_LIMIT_PER_MINUTE: ${VIZ_SEARCH_RATE_LIMIT_PER_MINUTE:-10}
    # Option A: reach the L17 database through the port published on the host.
    # Required on Linux, harmless on Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s

  viz-frontend:
    build: ./frontend
    image: embedding-explorer-frontend:1.0.0
    restart: unless-stopped
    ports:
      # 0.0.0.0 shares the tool, and therefore the documents, with the whole network.
      - "${VIZ_BIND_ADDRESS:-127.0.0.1}:${VIZ_HTTP_PORT:-8088}:8080"
    depends_on:
      viz-backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
