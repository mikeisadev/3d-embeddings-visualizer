# Embedding Explorer 3D: serves the React build and proxies /api/ to the backend (same
# origin, so no CORS). Included inside the http block of the image's nginx.conf.

server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types application/json application/problem+json application/octet-stream
           application/javascript text/css image/svg+xml;

# Docker's DNS: the backend is resolved at request time, so a restarted backend container
# (with a new IP) is found again without restarting nginx.
resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        set $backend http://viz-backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A first load of a large table (snapshot + PCA) or a slow embedding model can take
        # a while; /api/v1/points can be a few megabytes.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 90s;
        proxy_buffer_size 64k;
        proxy_buffers 64 64k;
        proxy_busy_buffers_size 128k;

        # The API only receives small JSON bodies (a question is at most 2,000 characters).
        client_max_body_size 64k;

        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Liveness of the frontend container itself.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed file names: safe to cache for a long time.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths serve index.html, which is never cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
